AWSTemplateFormatVersion: '2010-09-09'
Description: Optional single-AZ network with one fixed outbound IPv4 for the Sperant DNI Lambda

Resources:
  LookupVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.229.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LookupVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LookupVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.229.0.0/27
      MapPublicIpOnLaunch: false
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LookupVpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRoutes
      SubnetId: !Ref PublicSubnet

  EgressAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  EgressNat:
    Type: AWS::EC2::NatGateway
    DependsOn: [PublicDefaultRoute, PublicSubnetRoutes]
    Properties:
      AllocationId: !GetAtt EgressAddress.AllocationId
      SubnetId: !Ref PublicSubnet
      ConnectivityType: public

  LambdaSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LookupVpc
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      CidrBlock: 10.229.0.64/26
      MapPublicIpOnLaunch: false
  LambdaRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LookupVpc
  LambdaDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref LambdaRoutes
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref EgressNat
  LambdaSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref LambdaRoutes
      SubnetId: !Ref LambdaSubnet
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the DNI Lambda to reach providers and AWS services over HTTPS
      VpcId: !Ref LookupVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to providers and AWS APIs via NAT

Outputs:
  EgressIp:
    Description: Authorize this public IPv4 in Peru API before the first lookup
    Value: !Ref EgressAddress
  LambdaSubnetIds:
    Value: !Ref LambdaSubnet
  LambdaSecurityGroupIds:
    Value: !GetAtt LambdaSecurityGroup.GroupId
