AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sperant internal DNI lookup service

Parameters:
  ProvidersSecretArn:
    Type: String
    Default: ''
    Description: Full ARN of the provider configuration in Secrets Manager, or empty to use Lambda environment variables
    AllowedPattern: '(|arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+)'
  ClientAuthSecretArn:
    Type: String
    Default: ''
    Description: ARN of the client Bearer token secret, or empty to require AWS IAM
    AllowedPattern: '(|arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+)'
  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Optional comma-separated private subnet IDs with shared NAT egress
    AllowedPattern: '(|subnet-([a-f0-9]{8}|[a-f0-9]{17}))'
  LambdaSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Optional comma-separated security groups in the same VPC
    AllowedPattern: '(|sg-([a-f0-9]{8}|[a-f0-9]{17}))'

Rules:
  LambdaNetwork:
    Assertions:
      - Assert: !Or
          - !And [!EachMemberEquals [!Ref LambdaSubnetIds, ''], !EachMemberEquals [!Ref LambdaSecurityGroupIds, '']]
          - !And [!Not [!Contains [!Ref LambdaSubnetIds, '']], !Not [!Contains [!Ref LambdaSecurityGroupIds, '']]]
        AssertDescription: Set both LambdaSubnetIds and LambdaSecurityGroupIds, or leave both empty.

Conditions:
  UseBearerAuth: !Not [!Equals [!Ref ClientAuthSecretArn, '']]
  HasProvidersSecret: !Not [!Equals [!Ref ProvidersSecretArn, '']]
  UseSecrets: !Or [!Condition UseBearerAuth, !Condition HasProvidersSecret]
  HasLambdaVpc: !Not [!Equals [!Join ['', !Ref LambdaSubnetIds], '']]

Resources:
  HttpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  AccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  InternalApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AWS::StackName
      ProtocolType: HTTP
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref InternalApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 30
      AccessLogSettings:
        DestinationArn: !GetAtt AccessLogs.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status"}'
  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref InternalApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HttpFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
  LookupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InternalApi
      RouteKey: 'POST /v1/dni/consulta'
      AuthorizationType: !If [UseBearerAuth, NONE, AWS_IAM]
      Target: !Sub 'integrations/${HttpIntegration}'
  InvokeLookup:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HttpFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${InternalApi}/$default/POST/v1/dni/consulta'

  HttpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures: [arm64]
      CodeUri: service/
      Handler: src/bootstrap.http
      MemorySize: 256
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref HttpLogs
      Role: !GetAtt HttpRole.Arn
      VpcConfig: !If
        - HasLambdaVpc
        - SubnetIds: !Ref LambdaSubnetIds
          SecurityGroupIds: !Ref LambdaSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          CLIENT_AUTH_SECRET_ARN: !Ref ClientAuthSecretArn
          PROVIDERS_SECRET_ARN: !Ref ProvidersSecretArn

  HttpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !If
          - HasLambdaVpc
          - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
          - !Ref AWS::NoValue
      Policies:
        - !If
          - UseSecrets
          - PolicyName: ReadDniSecrets
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !If [UseBearerAuth, !Ref ClientAuthSecretArn, !Ref 'AWS::NoValue']
                    - !If [HasProvidersSecret, !Ref ProvidersSecretArn, !Ref 'AWS::NoValue']
          - !Ref AWS::NoValue

Outputs:
  ApiId:
    Value: !Ref InternalApi
  LookupUrl:
    Value: !Sub 'https://${InternalApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/dni/consulta'
